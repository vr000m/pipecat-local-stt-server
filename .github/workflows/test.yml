name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Base + backend extras. The MLX/Parakeet wheels are macOS/Apple-Silicon
  # only, so the full-extras job runs on macos-14 (Apple Silicon runners).
  test-macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync (base + mlx + parakeet)
        run: uv sync --extra mlx --extra parakeet
      - name: Protocol version gate
        run: |
          uv run python -c "from stt_server import protocol; assert protocol.PROTOCOL_VERSION == '0.1', protocol.PROTOCOL_VERSION; print('PROTOCOL_VERSION OK:', protocol.PROTOCOL_VERSION)"
      - name: Run tests
        run: uv run pytest -x

  # Client-only install on Linux, to prove the base package (no MLX/Parakeet)
  # resolves and the protocol/client/server surface tests pass without the
  # Apple-Silicon-only backends. Backend-specific tests are skipped here.
  test-linux-client:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync (client only)
        run: uv sync --extra client
      - name: Protocol version gate
        run: |
          uv run python -c "from stt_server import protocol; assert protocol.PROTOCOL_VERSION == '0.1', protocol.PROTOCOL_VERSION; print('PROTOCOL_VERSION OK:', protocol.PROTOCOL_VERSION)"
      - name: Run protocol/server/client tests (skip backend-weight tests)
        run: |
          uv run pytest -x \
            tests/test_stt_server.py \
            tests/test_protocol_version.py \
            tests/test_backend_protocol.py \
            tests/test_wire_schema_compat.py \
            tests/test_env_helpers.py \
            tests/test_stt_post_filter.py \
            tests/test_render_stt_plist.py \
            tests/test_supervised_cli.py \
            tests/test_prefetch_cli.py \
            tests/test_kyutai_backend.py

  # The kyutai extra pins an older MLX stack (moshi_mlx: mlx<0.27,
  # huggingface-hub<0.29) and is declared conflicting with the other MLX extras,
  # so it gets its own environment. Verifies it resolves and imports on Apple
  # Silicon; the live decode test skips without the cached ~2.4 GB weights.
  test-macos-kyutai:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync (base + kyutai)
        run: uv sync --extra kyutai
      # `--extra kyutai` on every `uv run`: a bare `uv run` re-syncs the default
      # (non-kyutai) fork of the lock and swaps numpy 2.2.6 for 2.4.6, so the job
      # would stop testing the locked kyutai environment.
      - name: Import smoke
        run: uv run --extra kyutai python -c "import moshi_mlx, sentencepiece; from moshi_mlx import models; print('moshi_mlx OK')"
      - name: Kyutai, supervised and prefetch tests
        run: uv run --extra kyutai pytest -x tests/test_kyutai_backend.py tests/test_supervised_cli.py tests/test_prefetch_cli.py
